# List of plugins
# macOS only: lets tpm (plugins) find Homebrew's git/bash. On Linux this would wipe
# ~/.local/bin, /usr/local/bin ... from every new pane's PATH, so it's skipped there.
if-shell '[ "$(uname)" = Darwin ]' 'set-environment -g PATH "/opt/homebrew/bin:/bin:/usr/bin"'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Save sessions every 15 min and restore them when tmux starts
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
# Restore pane contents and re-launch these programs
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh "~claude->claude --continue" nvim vim less man'
set -s escape-time 0

# macOS only: on Linux / WSL neither reattach-to-user-namespace nor zsh may exist, and a
# failing default-command makes every new pane close instantly. Elsewhere tmux uses $SHELL.
if-shell '[ "$(uname)" = Darwin ]' 'set -g default-command "reattach-to-user-namespace -l zsh"'
# Let programs inside tmux (nvim) set the outer terminal's clipboard (OSC 52): how copying
# reaches your Mac when nvim runs on another machine over SSH. "external" ignores them.
set -s set-clipboard on
# tmux display things in 256 colors
set -g default-terminal "screen-256color"

set -g history-limit 20000

set -g base-index 1
# automatically renumber tmux windows
set -g renumber-windows on

bind r source-file ~/.config/tmux/tmux.conf

bind -r ^ last-window
set -g status-style 'bg=#333333 fg=#5eacd3'
# right side: what Spotify / Apple Music is playing (hidden when paused), then time + date
# (replaces the default cut-off window title; tmux-continuum adds its saver to this itself)
set -g status-right '#(~/.config/tmux/scripts/now-playing.sh)%H:%M %d-%b-%y '
set -g status-right-length 80
# unbind default prefix and set it to Ctrl+a
unbind C-b
set -g prefix C-a

# Bind Ctrl-a L to go to the last Tmux session
bind L switch-client -n

# Bind Ctrl-a l to go to the last Tmux window
bind l select-window -l

bind-key w new-window

bind C-a send-prefix

# New machine: plugins aren't in git, so download tpm + the plugins above on first start.
# Checks the last plugin, not tpm: if a first start was interrupted after tpm arrived,
# the others would otherwise never install (and save / restore would silently do nothing).
if "test ! -d ~/.config/tmux/plugins/tmux-continuum" \
   "run 'test -d ~/.config/tmux/plugins/tpm || git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm; ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
